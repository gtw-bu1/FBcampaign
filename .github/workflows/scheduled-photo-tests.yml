name: Scheduled photo regression tests
on:
  push:
    branches: [verify/scheduled-photo-node-tests]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
