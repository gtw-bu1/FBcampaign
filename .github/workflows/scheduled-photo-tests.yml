name: Check the scheduled post as a signed-out visitor
on:
  push:
    branches: [verify/scheduled-photo-node-tests]
permissions:
  contents: read
jobs:
  visitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare visitor browser
        run: npm install --prefix "$RUNNER_TEMP/visitor" --no-fund --no-audit playwright-core@1.56.1
      - name: Check the public feed and the immediate-post control after publication time
        run: |
          cd "$RUNNER_TEMP/visitor"
          CHROME_PATH="$(command -v google-chrome)" node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core'
          import { mkdir, writeFile } from 'node:fs/promises'
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
          const due = Date.parse('2026-11-27T15:09:00+08:00')
          await wait(Math.max(0, due - Date.now()))
          const browser = await chromium.launch({executablePath: process.env.CHROME_PATH, headless: true})
          const context = await browser.newContext({locale:'zh-TW', timezoneId:'Asia/Taipei', viewport:{width:1200,height:900}})
          const path = process.env.GITHUB_WORKSPACE + '/visitor-evidence'
          const open = async (url) => {
            const page = await context.newPage()
            await page.goto(url, {waitUntil:'domcontentloaded',timeout:35000})
            await page.waitForTimeout(2200)
            const dialog = page.getByRole('dialog').first()
            if (await dialog.isVisible()) {
              const close = dialog.getByRole('button',{name:/^(close|關閉)$/i}).first()
              if (await close.isVisible()) await close.click().catch(()=>{})
            }
            return page
          }
          const markers = /和艾莉的秋冬約會|艾莉（永久）送給你|微涼的秋冬微風悄悄吹起/
          const controlUrl = 'https://www.facebook.com/1572421051588869/posts/1579963497501291'
          async function validate(page, label) {
            const text = await page.locator('body').innerText()
            const articles = page.getByRole('article')
            const hasLogin = /登入|登錄|log in|log into/i.test(text)
            console.log(label, 'url-path', new URL(page.url()).pathname, 'login-text', hasLogin, 'articles', await articles.count(), 'campaign-text', markers.test(text))
          }
          try {
            const feed = await open('https://www.facebook.com/csoline.tw')
            await validate(feed,'page')
            const card = feed.getByRole('article').filter({hasText:markers}).first()
            if (await card.isVisible()) {
              await mkdir(path,{recursive:true})
              await card.scrollIntoViewIfNeeded()
              await feed.screenshot({path:path+'/page-feed.png'})
              const links = await card.locator('a[href]').evaluateAll(nodes=>nodes.map(n=>n.href))
              const url = links.find(value => {const u=new URL(value);return /^(www\.|m\.)?facebook\.com$/.test(u.hostname) && (/\/posts\//.test(u.pathname) || u.searchParams.has('story_fbid') || /\/permalink\//.test(u.pathname))})
              if (url) {
                const post = await open(url)
                await validate(post,'scheduled-permalink')
                if (markers.test(await post.locator('body').innerText())) {
                  await post.screenshot({path:path+'/scheduled-post.png'})
                  await writeFile(path+'/post-url.txt',url)
                }
              }
            }
            const control = await open(controlUrl)
            await validate(control,'control')
            if (await card.isVisible() && await control.getByRole('article').first().isVisible())
              await control.screenshot({path:path+'/immediate-post.png'})
          } finally {await browser.close()}
          NODE
      - name: Save available public-post screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visitor-evidence
          path: visitor-evidence/
          if-no-files-found: ignore
          retention-days: 1
