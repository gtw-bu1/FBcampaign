name: Verify single and multiple photo posts
on:
  push:
    branches: [verify/scheduled-photo-node-tests]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ref: ['810514c386e9a010727bd006f3da6b95262016d6', '540f47dfa4b925f375f3c7dfca35ba4a54c6226a']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: TZ=Asia/Taipei npm test
      - run: npm run build
      - name: Exercise the attachment picker and payload in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" --no-fund --no-audit playwright-core@1.56.1
          npm run dev -- --port 4173 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          cd "$RUNNER_TEMP/browser-test"
          CHROME_PATH="$(command -v google-chrome)" node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core'
          import assert from 'node:assert/strict'
          const browser = await chromium.launch({executablePath:process.env.CHROME_PATH})
          try {
            const page=await browser.newPage()
            await page.goto('http://localhost:4173')
            const file=page.getByLabel('附加發布圖片')
            await file.setInputFiles([{name:'extra.png',mimeType:'image/png',buffer:Buffer.from([111,112])}])
            await page.getByRole('button',{name:'移除 extra.png'}).click()
            assert.equal(await page.getByRole('button',{name:'移除 extra.png'}).count(),0)
            const payload = await page.evaluate(async()=>{
              const {makeFeedPayload}=await import('/src/feed-payload.mjs')
              const blob=new File([new Uint8Array([111,112])],'extra.png',{type:'image/png'})
              return JSON.parse(await makeFeedPayload('example','data:image/png;base64,AAAA',[blob],1234567890))
            })
            assert.deepEqual(payload,{message:'example',imageDataUrls:['data:image/png;base64,AAAA','data:image/png;base64,b3A='],scheduledPublishTime:1234567890})
            console.log('Attachment picker, removal, actual FileReader and ordered JSON passed')
          } finally {await browser.close()}
          NODE
