name: Verify Supabase scheduled photos
on:
  push:
    branches: [verify/supabase-photo-scheduler]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: TZ=Asia/Taipei npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Supabase PostgreSQL
        run: |
          docker run -d --name queue-fixture --network none -e POSTGRES_PASSWORD=local-fixture-only -e POSTGRES_DB=postgres supabase/postgres:17.6.1.136 postgres -c config_file=/etc/postgresql/postgresql.conf
          for i in $(seq 1 90); do
            if docker exec queue-fixture pg_isready -h 127.0.0.1 -q -U supabase_admin && docker exec queue-fixture psql -U supabase_admin -d postgres -tAc "select 1 from pg_roles where rolname='service_role'" | grep -qx 1; then break; fi
            sleep 2
          done
          docker exec queue-fixture pg_isready -h 127.0.0.1 -U supabase_admin
      - name: Apply schema and exercise scheduling, cancellation and replay protection
        run: |
          docker exec -i queue-fixture psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < supabase/scheduled-photos.sql
          docker exec -i queue-fixture psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < tests/sql/scheduled-photos.sql
      - name: Wait for a real minute tick (isolated network)
        run: |
          psql_test() { docker exec queue-fixture psql -qAt -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "$1"; }
          psql_test "insert into public.fb_photo_jobs(id,page_id,due_at,message,image_data) values(repeat('d',64),'55555',clock_timestamp()+interval '10 seconds','fixture','test-only');"
          test "$(psql_test "select ticket is null from public.fb_photo_jobs where id=repeat('d',64)")" = t
          for i in $(seq 1 40); do
            if test "$(psql_test "select count(*) from public.fb_photo_jobs where id=repeat('d',64) and ticket is not null and due_at <= now()")" = 1; then
              echo 'The actual minute timer dispatched the saved job after its due time.'
              exit 0
            fi
            sleep 3
          done
          exit 1
